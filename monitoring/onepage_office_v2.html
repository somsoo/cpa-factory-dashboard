<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnePage Factory 관제실 (미니멀)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: #cbd5e1; font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="p-4 sm:p-8 flex justify-center items-center min-h-screen">
    <div class="w-full max-w-4xl bg-slate-900 border border-slate-700 rounded-xl shadow-2xl p-6">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <h1 class="text-xl font-bold text-white flex items-center">
                <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse mr-3"></span>
                실시간 작업 현황
            </h1>
            <p id="last-updated" class="text-xs text-slate-400 font-mono">--:--:--</p>
        </div>
        
        <table class="w-full text-left border-collapse text-sm">
            <thead>
                <tr class="text-slate-500 border-b border-slate-800">
                    <th class="pb-3 w-1/4 font-medium">요원명</th>
                    <th class="pb-3 w-1/6 font-medium text-center">상태</th>
                    <th class="pb-3 w-7/12 font-medium">현재 진행 중인 작업</th>
                </tr>
            </thead>
            <tbody id="active-agents" class="divide-y divide-slate-800/50">
                <tr><td colspan="3" class="py-4 text-center">로딩 중...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        function escapeHtml(unsafe) { return (unsafe || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

        async function updateStatus() {
            try {
                const res = await fetch('onepage_status.json?' + new Date().getTime());
                const data = await res.json();
                document.getElementById('last-updated').textContent = "마지막 동기화: " + new Date(data.last_updated).toLocaleTimeString();
                
                const tbody = document.getElementById('active-agents');
                tbody.innerHTML = '';
                
                let activeCount = 0;
                data.agents.sort((a,b) => b.id.localeCompare(a.id)).forEach(agent => {
                    const msg = agent.last_message || '';
                    let isIdle = agent.status.includes('IDLE') || agent.status.includes('FINISHED') || msg.includes('finished with result') || msg.includes('완료') || msg.includes('종료');
                    
                    if (!isIdle) {
                        activeCount++;
                        const row = document.createElement('tr');
                        row.className = "hover:bg-slate-800/50 transition-colors";
                        row.innerHTML = \
                            <td class="py-3 pr-4 font-bold text-slate-200">\</td>
                            <td class="py-3 px-2 text-center"><span class="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-1 rounded border border-emerald-500/30">작업중</span></td>
                            <td class="py-3 pl-4 text-slate-400 font-mono truncate max-w-xs" title="\">\</td>
                        \;
                        tbody.appendChild(row);
                    }
                });

                if (activeCount === 0) tbody.innerHTML = '<tr><td colspan="3" class="py-8 text-center text-slate-500">현재 작업 중인 요원이 없습니다.</td></tr>';
            } catch (e) {}
        }
        setInterval(updateStatus, 3000);
        updateStatus();
    </script>
</body>
</html>

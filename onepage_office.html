<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-Page Factory - Virtual Office</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Pretendard', sans-serif; }
        .office-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; padding: 2rem; }
        .desk { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 1.5rem; position: relative; transition: all 0.3s ease; }
        .desk.running { border-color: #22c55e; box-shadow: 0 0 20px rgba(34, 197, 94, 0.2); }
        .desk.error { border-color: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); }
        .desk.idle { opacity: 0.6; filter: grayscale(50%); }
        .avatar { font-size: 4rem; text-align: center; margin-bottom: 1rem; transition: transform 0.3s; }
        .running .avatar { animation: bounce 1s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
        .speech-bubble { background: white; color: black; padding: 0.75rem; border-radius: 1rem; font-size: 0.875rem; position: relative; margin-bottom: 1rem; min-height: 3rem; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: bold; }
        .speech-bubble::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); border-width: 10px 10px 0; border-style: solid; border-color: white transparent transparent transparent; }
        .status-badge { position: absolute; top: -10px; right: -10px; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: bold; }
        .bg-running { background: #22c55e; color: white; }
        .bg-idle { background: #64748b; color: white; }
        .bg-error { background: #ef4444; color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
        <div>
            <h1 class="text-3xl font-extrabold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">One-Page Factory</h1>
            <p class="text-slate-400 mt-1">Virtual Agent Office Monitor (Real-time)</p>
        </div>
        <div class="text-right">
            <p class="text-sm text-slate-400">Last Synced</p>
            <p id="last-updated" class="font-mono font-bold text-green-400">Loading...</p>
        </div>
    </header>

    <main class="flex-grow office-grid" id="office-floor">
        <!-- Agents will be rendered here -->
    </main>

    <script>
        async function fetchStatus() {
            try {
                // Add timestamp to prevent caching
                const res = await fetch('onepage_status.json?t=' + new Date().getTime());
                const data = await res.json();
                
                document.getElementById('last-updated').textContent = new Date(data.last_updated).toLocaleTimeString();
                
                const floor = document.getElementById('office-floor');
                floor.innerHTML = '';
                
                for (const [key, agent] of Object.entries(data.agents)) {
                    const statusClass = agent.status.toLowerCase();
                    const badgeColor = agent.status === 'RUNNING' ? 'bg-running' : (agent.status === 'ERROR' ? 'bg-error' : 'bg-idle');
                    
                    const card = `
                        <div class="desk ${statusClass}">
                            <div class="status-badge ${badgeColor}">${agent.status}</div>
                            <div class="speech-bubble">${agent.message}</div>
                            <div class="avatar">${agent.emoji}</div>
                            <h2 class="text-xl font-bold text-center text-white">${agent.name}</h2>
                        </div>
                    `;
                    floor.innerHTML += card;
                }
            } catch (err) {
                console.error("Failed to fetch status", err);
            }
        }

        // Fetch immediately, then every 5 seconds
        fetchStatus();
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
